
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t devops-intern-final:${{ github.sha }} \
            ./app

      - name: Save image
        run: docker save devops-intern-final:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: image.tar
          retention-days: 1

  test:
    name: Test Container
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: docker load --input image.tar

      - name: Run container
        run: |
          docker run -d \
            --name devops-nginx \
            -p 8080:8080 \
            devops-intern-final:${{ github.sha }}

      - name: Wait for application readiness
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to become ready"
          docker logs devops-nginx
          exit 1

      - name: Run healthcheck script
        run: |
          if ! ./scripts/healthcheck.sh http://localhost:8080/healthz; then
            docker logs devops-nginx
            exit 1
          fi

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: docker load --input image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag devops-intern-final:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

          docker tag devops-intern-final:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:latest

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
